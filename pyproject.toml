[tool.poetry]
name = "xosc-editor"
version = "0.0.0"
description = "ASAM OpenSCENARIO 1.2 対応デスクトップ型シナリオエディタ"
authors = ["Your Name <you@example.com>"]
readme = "README.md"
packages = [{include = "osc_editor"}]

[tool.poetry.dependencies]
python = ">=3.11,<3.13"
PySide6 = "^6.6.0"
lxml = "^5.0.0"

[tool.poetry.group.dev.dependencies]
pytest = "^7.4.0"
black = "^23.0.0"
ruff = "^0.1.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.poetry.scripts]
osc-editor = "osc_editor.app:main"


